name = "soxl-bot"
main = "index.js"
compatibility_date = "2026-08-01"

# KV 네임스페이스. id 는 `wrangler kv namespace create STATE` 결과로 채운다.
[[kv_namespaces]]
binding = "STATE"
id = "67eb473e9a3344b5ace1c11b4eabf280"

[vars]
GH_REPO = "meatson89-web/soxl-signal-bot"

# 15분 트리거 — GitHub Actions 의 check.yml 을 깨운다 (GH 스케줄러는 못 믿는다).
#   창은 check.yml 의 schedule 과 같다. ET 04:00(프리장)~20:00(애프터장) 을
#   서머타임·겨울 양쪽 커버하려고 두 줄로 나눈다.
# 감시견   — 매 평일 UTC 22:00 (KST 07:00, 미국장 마감 후).
[triggers]
crons = ["*/15 8-23 * * 1-5", "*/15 0-1 * * 2-6", "0 22 * * 1-5"]
