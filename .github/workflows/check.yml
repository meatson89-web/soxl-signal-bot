name: SOXL signal check

on:
  schedule:
    # UTC. 프리장 ET 04:00 ~ 애프터장 ET 20:00 을 서머타임·겨울 양쪽 커버한다.
    #   EDT(UTC-4) → 08:00~24:00 UTC / EST(UTC-5) → 09:00~01:00 UTC(익일)
    # 그래서 8-23 시(월~금) 와 0-1 시(화~토) 두 줄로 나눈다.
    # 15분마다 돌지만 bot.py 가 멱등이라 새 봉이 없으면 아무것도 하지 않는다.
    # 시간외에는 봉을 만들지 않고 예고·급등락만 본다.
    - cron: '*/15 8-23 * * 1-5'
    - cron: '*/15 0-1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soxl-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run signal check
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BOT_SYNC_SECRET: ${{ secrets.BOT_SYNC_SECRET }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py

      - name: Commit signal log
        run: |
          if [ -n "$(git status --porcelain signals.log)" ]; then
            git config user.name  'soxl-bot'
            git config user.email 'soxl-bot@users.noreply.github.com'
            git add signals.log
            git commit -m "signals $(date -u +%Y-%m-%d)"
            git push
          fi
