name: SOXL signal check

on:
  schedule:
    # UTC. 미국 정규장 1시간봉 마감(ET 10:00~16:00)을 서머타임·겨울 양쪽 커버.
    # 15분마다 돌지만 bot.py 가 멱등이라 새 봉이 없으면 아무것도 하지 않는다.
    - cron: '*/15 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soxl-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run signal check
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BOT_SYNC_SECRET: ${{ secrets.BOT_SYNC_SECRET }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python bot.py

      - name: Commit signal log
        run: |
          if [ -n "$(git status --porcelain signals.log)" ]; then
            git config user.name  'soxl-bot'
            git config user.email 'soxl-bot@users.noreply.github.com'
            git add signals.log
            git commit -m "signals $(date -u +%Y-%m-%d)"
            git push
          fi
